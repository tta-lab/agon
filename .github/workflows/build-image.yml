name: Build and Publish Agon Runner Image
on:
  push:
    branches:
      - main
    tags:
      - v*.*.*
  pull_request:
    branches:
      - main
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/agon-runner
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: agon_bench/runner/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify image (smoke check)
        if: github.event_name != 'pull_request'
        run: |
          # Pull the image back by digest to verify
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          docker run --rm --entrypoint /bin/bash ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }} -c '
            set -euo pipefail
            echo "=== Lenos version ==="
            lenos --version
            echo ""
            echo "=== Temenos version ==="
            temenos --version
            echo ""
            echo "=== Python version ==="
            python3 --version
            echo ""
            echo "=== Runner scripts ==="
            test -f /usr/local/bin/agon-run && echo "OK: agon-run"
            test -f /usr/local/bin/agon-runner.py && echo "OK: agon-runner.py"
            echo ""
            echo "All smoke checks passed."
          '
      - name: Image summary
        if: github.event_name != 'pull_request'
        run: |
          echo "### Published image" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** ${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          for tag in ${{ steps.meta.outputs.tags }}; do
            echo "- $tag" >> $GITHUB_STEP_SUMMARY
          done
