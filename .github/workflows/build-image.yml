name: Build and Publish Agon Runner Image
on:
  push:
    branches:
      - main
    tags:
      - v*.*.*
  pull_request:
    branches:
      - main
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/agon-runner
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build image (and push on main/tags)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: agon_bench/runner/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Binary smoke check
        run: |
          docker run --rm --entrypoint /bin/bash ${{ steps.meta.outputs.tags }} -c '
            set -euo pipefail
            echo "=== Lenos version ==="
            lenos --version
            echo ""
            echo "=== Temenos version ==="
            temenos --version
            echo ""
            echo "=== Python version ==="
            python3 --version
            echo ""
            echo "=== Runner scripts ==="
            test -f /usr/local/bin/agon-run && echo "OK: agon-run"
            test -f /usr/local/bin/agon-runner.py && echo "OK: agon-runner.py"
            echo ""
            echo "All binary smoke checks passed."
          '
      - name: Image summary
        if: github.event_name != 'pull_request'
        run: |
          echo "### Published image" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** ${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          for tag in ${{ steps.meta.outputs.tags }}; do
            echo "- $tag" >> $GITHUB_STEP_SUMMARY
          done
  verify-task:
    name: Verify smoke task (no-key)
    runs-on: ubuntu-latest
    needs: build-image
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and load image for verification
        id: build-verify
        uses: docker/build-push-action@v6
        with:
          context: .
          file: agon_bench/runner/Dockerfile
          load: true
          tags: agon-bench:ci-verify
          cache-from: type=gha
      - name: Copy task files into container and run verifier
        run: |
          IMAGE="agon-bench:ci-verify"
          echo "=== Running smoke task reference solution ==="
          docker run --rm \
            --entrypoint /bin/bash \
            -v $(pwd)/agon_bench/tasks/smoke:/task \
            "$IMAGE" -c '
              set -euo pipefail
              cp /task/solution.sh /tmp/
              cp /task/run-tests.sh /tmp/
              cp /task/setup-uv-pytest.sh /tmp/
              cp /task/run-uv-pytest.sh /tmp/
              cp -r /task/tests /tmp/tests
              export TEST_DIR=/tmp/tests
              cd /tmp
              echo "--- Running solution.sh ---"
              bash solution.sh
              echo ""
              echo "--- Solution output ---"
              cat hello.txt
              echo ""
              echo "--- Installing test dependencies ---"
              bash setup-uv-pytest.sh
              echo "--- Running verifier ---"
              python3 -m pytest /tmp/tests/test_outputs.py -v
            '
      - name: Verifier summary
        run: |
          echo "### Smoke task verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "No provider credentials required. Checks:" >> $GITHUB_STEP_SUMMARY
          echo "- Reference solution.sh runs successfully" >> $GITHUB_STEP_SUMMARY
          echo "- pytest verifier passes against solution output" >> $GITHUB_STEP_SUMMARY
