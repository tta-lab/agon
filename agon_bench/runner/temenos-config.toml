# temenos config for the Agon Docker container.
# Minimal sandbox policy — lenos needs to read its config and write to workspace.
# Env vars to pass through to sandboxed processes.
allow_env = [
  "TTAL_*",
  "LENOS_*",
  "HOME",
  "USER",
  "SHELL",
  "PATH",
  "DEBUG",
  "CI",
  "NO_COLOR",
  "FORCE_COLOR",
]
# Paths the agent may read.
allow_read = [
  "/usr/local/bin",              # lenos, temenos, python3 binaries
  "/usr/bin",                    # system tools
  "/bin",
  "/workspace",                  # task workspace
]
# Paths the agent may write.
allow_write = [
  "/workspace",                  # task workspace — agent creates files here
  "/tmp",                        # general temp
]
