services:
  client:
    image: ${T_BENCH_TASK_DOCKER_CLIENT_IMAGE_NAME}
    container_name: ${T_BENCH_TASK_DOCKER_NAME_PREFIX}__client
    volumes:
      - ${T_BENCH_TASK_LOGS_PATH}:${T_BENCH_CONTAINER_LOGS_PATH}
      - ${T_BENCH_TEST_DIR}:${T_BENCH_TEST_DIR}
    environment:
      - TEST_DIR=${T_BENCH_TEST_DIR}
