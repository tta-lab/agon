# https://taskfile.dev
#
# Agon — Terminal-Bench arena for Lenos evaluation.
# Makefile + scripts/ are the primary interface. Taskfile is optional.
version: "3"
tasks:
  build-image:
    desc: Build the benchmark Docker image
    cmds:
      - ./scripts/build-image.sh
  run-smoke:
    desc: Run the smoke task through the benchmark adapter
    cmds:
      - task: build-image
      - ./scripts/run-smoke.sh
  test-solution:
    desc: Verify smoke task reference solution + pytest
    cmds:
      - task: build-image
      - ./scripts/test-solution.sh
  results:
    desc: Show latest benchmark results
    cmds:
      - ./scripts/results.sh
  shell:
    desc: Open interactive shell in the benchmark container
    cmds:
      - task: build-image
      - ./scripts/shell.sh
  fmt:
    desc: Format Python and shell files
    cmds:
      - ./scripts/fmt.sh
  lint:
    desc: Lint Python files
    cmds:
      - ./scripts/lint.sh
  clean:
    desc: Remove Docker image and clear results
    cmds:
      - ./scripts/clean.sh
